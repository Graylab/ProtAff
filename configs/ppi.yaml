defaults:
  - _self_
  - model: esm_binding

# ==========================================
# TASK CONFIGURATION
# ==========================================
task_name: "ppi"

# ==========================================
# CHECKPOINT PATHS
# ==========================================
# Pretrained model to load weights from (e.g., from Phase 1 DMS training)
pretrained_ckpt_path: null

# Resume training from a specific checkpoint (e.g., "outputs/.../checkpoints/last.ckpt")
resume_checkpoint_path: null

# ==========================================
# DATA CONFIGURATION
# ==========================================
data:
  # Data files
  pairs_csv: "data/ppi/ppi_pairs.csv"
  lookup_csv: "data/ppi/ppi_lookup.csv"

  # Optional filters
  sources: null  # or ["PPI", "DNS", "DNU"]
  min_confidence: null
  max_confidence: null

  # Label
  invert_label: true  # 1 - confidence (lower = better)
  use_weighted_sampler: True
  confidence_threshold: 0.5

  # Split (only used if strategy=group)
  split_col: "protein_a"
  
  # DataLoader
  num_workers: 6
  
# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  # Reproducibility
  seed: 42
  
  # Data splitting (CRITICAL: Val must have unseen targets for your task)
  split_strategy: "random"                     # "group" = split by target_id (val has unseen targets)
  train_val_split: 0.95                        # 90% targets for train, 10% for val
  
  # Batch configuration
  batch_size: 16
  accumulate_grad_batches: 2                 # Effective batch size = 16 * 2 = 32
  max_epochs: 2

  # Loss Function
  loss_type: "bce"  # Options: margin, soft_margin, bce, margin_weighted, contrastive
  focal_gamma: 2.0
  focal_alpha: 0.04
  
  # Optimizer
  learning_rate: 1e-4
  weight_decay: 1e-2                          # High weight decay for regularization
  warmup_ratio: 0.1
  
  # Model saving 
  monitor_metric: "val_loss"              # Metric to monitor: "val_loss", "val_spearman", "test_spearman"
  monitor_mode: "min"                         # "min" for loss, "max" for spearman/accuracy
  
  # Early stopping
  early_stopping: true
  early_stopping_patience: 4                  # Stop after N val checks without improvement
  
  # Testing
  test_every_val: false                        # Run test evaluation after each validation
  
  # Hardware
  accelerator: "auto"                         # "gpu", "cpu", or "auto"
  devices: "auto"                             # Number of devices or "auto"
  strategy: "auto" # Distributed strategy
  precision: "bf16-mixed"                     # "16-mixed", "bf16-mixed", or "32"
  
  # Training stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 0.25                    # Validate 4x per epoch
  
  wandb:
    project: "ppi-pretrain"

# ==========================================
# HYDRA OUTPUT CONFIGURATION (unchanged)
# ==========================================
hydra:
  run:
    dir: outputs/ppi/${now:%Y-%m-%d}/${now:%H-%M-%S}
