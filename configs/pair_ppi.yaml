defaults:
  - _self_
  - model: esm_binding

# Task name (Informational for logging)
task_name: "pair_ppi"

# --- TRANSFER LEARNING ---
# Pretrained model to load weights from (e.g., from a pretrained model)
pretrained_ckpt_path: null

# Resume training from a crash (Load optimizer state)
resume_checkpoint_path: null

data:
  # --- Paths ---
  pairs_csv: "data/ppi/ppi_pairs.csv"
  lookup_csv: "data/ppi/ppi_lookup.csv"
  test_csv: "data/test/test_adaptyv.csv"
  binary_test_csv: "data/test/test_binary.csv"
  sources: null

  # --- Pair Mining ---
  min_margin: 0.1
  pairs_per_anchor: 500
  max_anchors: 500000
  group_col: "protein_a"

  # --- Split ---
  split_col: "protein_a"

  # --- Sampling & Balancing ---
  weight_col: "protein_a"
  balance_clusters: true
  balance_power: 0.25

  # --- DataLoader ---
  num_workers: 6

training:
  seed: 42
  split_strategy: "group"
  train_val_split: 0.9

  # Batch and Steps
  batch_size: 16
  accumulate_grad_batches: 2
  max_epochs: 10

  # Loss Function
  loss_type: "margin_weighted"
  margin: 0.1
  temperature: 0.1  # For contrastive loss

  # Optimizer
  learning_rate: 1e-4
  weight_decay: 1e-2
  warmup_ratio: 0.1

  # Model saving
  monitor_metric: "val_loss"
  monitor_mode: "min"

  # Early Stopping
  early_stopping: true
  early_stopping_patience: 5

  # Testing
  test_every_val: true
  test_binary_every_val: true
  binary_test_every_n_epoch: 1

  # Hardware
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  precision: "bf16-mixed"

  # Stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 0.5

  wandb:
    project: "ppi-pretrain"

# Standard Hydra Output
hydra:
  run:
    dir: outputs/pair_ppi/${now:%Y-%m-%d}/${now:%H-%M-%S}
