defaults:
  - _self_
  - model: esm_cross_attn

# ==========================================
# TASK CONFIGURATION
# ==========================================
task_name: "pair_ppi"

# ==========================================
# CHECKPOINT PATHS
# ==========================================
# Pretrained model to load weights from (e.g., from Phase 1 DMS training)
pretrained_ckpt_path: null

# Resume training from a specific checkpoint (e.g., "outputs/.../checkpoints/last.ckpt")
resume_checkpoint_path: null

# ==========================================
# DATA CONFIGURATION
# ==========================================
data:
  # Data files
  pairs_csv: "data/ppi/ppi_pairs.csv"
  lookup_csv: "data/ppi/ppi_lookup.csv"
  sources: null

  # Pair generation
  min_margin: 0.1
  pairs_per_anchor: 50
  max_anchors: 500000
  group_col: "protein_a"

  # Split
  split_col: "protein_a"
  
  # DataLoader
  num_workers: 6
  
  # Balancing configuration
  balance_clusters: false                      # Enable weighted sampling by target_id
  balance_power: 0.25                         # Balancing strength (0.25=gentle, 0.5=medium, 1.0=aggressive)
  weight_col: null                            # Alternative weighting column (usually null)
  
# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  # Reproducibility
  seed: 42
  
  # Data splitting (CRITICAL: Val must have unseen targets for your task)
  split_strategy: "group"                     # "group" = split by target_id (val has unseen targets)
  train_val_split: 0.9                        # 90% targets for train, 10% for val
  
  # Batch configuration
  batch_size: 16
  accumulate_grad_batches: 1                 # Effective batch size = 16 * 2 = 32
  max_epochs: 5

  # Loss Function
  loss_type: "margin"
  margin: 0.1
  
  # Optimizer
  learning_rate: 1e-4
  weight_decay: 1e-2                          # High weight decay for regularization
  warmup_ratio: 0.1
  
  # Model saving 
  monitor_metric: "val_loss"              # Metric to monitor: "val_loss", "val_spearman", "test_spearman"
  monitor_mode: "min"                         # "min" for loss, "max" for spearman/accuracy
  
  # Early stopping
  early_stopping: true
  early_stopping_patience: 3                  # Stop after N epochs without improvement
  
  # Testing
  test_every_val: false                        # Run test evaluation after each validation
  
  # Hardware
  accelerator: "auto"                         # "gpu", "cpu", or "auto"
  devices: "auto"                             # Number of devices or "auto"
  strategy: "auto" # Distributed strategy
  precision: "bf16-mixed"                     # "16-mixed", "bf16-mixed", or "32"
  
  # Training stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 0.5                     # Validate every 0.5 epochs
  
  wandb:
    project: "ppi-pretrain"

# ==========================================
# HYDRA OUTPUT CONFIGURATION (unchanged)
# ==========================================
hydra:
  run:
    dir: outputs/pair_ppi/${now:%Y-%m-%d}/${now:%H-%M-%S}
