# configs/dms.yaml
defaults:
  - _self_
  - model: esm_lora

data:
  mutant_csv: "data/dummy_dms/mutants.csv"
  wt_csv: "data/dummy_dms/wildtypes.csv"
  num_workers: 6

training:
  seed: 42
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 1e-4
  max_epochs: 20
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  use_mixed_precision: false
  accumulate_grad_batches: 1

  wandb:
    project: "dms-pretrain"

# Hydra handles the output path logic
hydra:
  run:
    dir: outputs/phase1_dms/${now:%Y-%m-%d}/${now:%H-%M-%S}