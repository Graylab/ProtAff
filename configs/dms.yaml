defaults:
  - _self_
  - model: esm_cross_attn

# Task name
task_name: "dms"

# Resume path to a specific .ckpt file (e.g., "outputs/.../checkpoints/last.ckpt")
resume_checkpoint_path: null

data:
  mutant_csv: "data/dummy_dms/mutants.csv"
  wt_csv: "data/dummy_dms/wildtypes.csv"
  crop_method: "smart"
  num_workers: 6
  weight_col: null
  balance_clusters: true

training:
  seed: 42

  # Batch and Steps
  batch_size: 16
  accumulate_grad_batches: 2
  max_epochs: 5

  # Optimizer
  learning_rate: 1e-4  
  weight_decay: 1e-2
  warmup_ratio: 0.1

  # Model saving 
  monitor_metric: "val_loss"              # Metric to monitor: "val_loss", "val_spearman", "test_spearman"
  monitor_mode: "min"                         # "min" for loss, "max" for spearman/accuracy

  # Early stopping
  early_stopping: true
  early_stopping_patience: 3                  # Stop after N epochs without improvement

  # Hardware
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  precision: "bf16-mixed"

  # Stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 0.25    

  wandb:
    project: "dms-pretrain"

# Hydra handles the output path logic
hydra:
  run:
    dir: outputs/dms/${now:%Y-%m-%d}/${now:%H-%M-%S}
