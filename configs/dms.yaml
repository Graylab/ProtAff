# configs/dms.yaml
defaults:
  - _self_
  - model: esm_lora

# Resume path to a specific .ckpt file (e.g., "outputs/.../checkpoints/last.ckpt")
resume_checkpoint_path: null

data:
  mutant_csv: "data/dummy_dms/mutants.csv"
  wt_csv: "data/dummy_dms/wildtypes.csv"
  num_workers: 6
  weight_col: null
  balance_clusters: false

training:
  seed: 42
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 1e-4
  max_epochs: 5

  # Hardware
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  use_mixed_precision: true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

  wandb:
    project: "dms-pretrain"

# Hydra handles the output path logic
hydra:
  run:
    dir: outputs/phase1_dms/${now:%Y-%m-%d}/${now:%H-%M-%S}
