defaults:
  - _self_
  - model: esm_cross_attn

# Task name (Informational for logging)
task_name: "pair_affinity"

# --- TRANSFER LEARNING ---
# Path to the Phase 1 (DMS) adapter weights
# e.g., "outputs/phase1_dms/2025-12-25/12-00-00/saved_model"
pretrained_ckpt_path: null

# Resume training from a crash (Load optimizer state)
resume_checkpoint_path: null

data:
  # --- Paths ---
  base_csv: "data/combined/base_cleaned.csv"
  lookup_csv: "data/combined/lookup_data.csv"
  test_csv: "data/test/test_adaptyv.csv"
  binary_test_csv: "data/test/test_binary.csv"
  
  # --- Pair Mining ---
  pairs_per_sample: 2
  inter_pps: 10
  min_margin: 1.0
  max_anchors_per_target: 2000
  
  # --- Negative Sampling ---
  add_negatives: false
  neg_per_positive: 5
  neg_log_aff: 5.0
  
  # --- Sampling & Balancing ---
  weight_col: null
  balance_clusters: true
  balance_power: 0.25
  
  # --- DataLoader ---
  num_workers: 6

training:
  seed: 42
  split_strategy: "group"
  train_val_split: 0.9

  # Batch and Steps
  # Note: Effective batch size = batch_size * 2 (since we process Better + Worse)
  batch_size: 8              # Lowered slightly as we process 2x sequences per step
  accumulate_grad_batches: 4 # Increased to maintain effective batch size
  max_epochs: 15             # Ranking often takes longer to converge than regression

  # Loss Function
  margin: 0.1                # Margin for MarginRankingLoss (diff between scores must be > this)

  # Optimizer
  learning_rate: 1e-4        # Slightly lower LR is often better for ranking fine-tuning
  weight_decay: 1e-2
  warmup_ratio: 0.1

  # Model saving 
  monitor_metric: "val_per_target_spearman"              # Metric to monitor: "val_loss", "val_spearman", "test_spearman"
  monitor_mode: "max"                         # "min" for loss, "max" for spearman/accuracy

  # Early Stopping
  early_stopping: true
  early_stopping_patience: 5                  # Stop after N epochs without improvement

  # Testing
  test_every_val: true                        # Run test evaluation after each validation
  test_binary_every_val: true
  binary_test_every_n_epoch: 1

  # Hardware
  accelerator: "auto"
  devices: "auto"
  strategy: "ddp_find_unused_parameters_true"
  precision: "bf16-mixed"

  # Stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 0.5    # Validate every half epoch
  
  wandb:
    project: "pair-affinity-finetune"

# Standard Hydra Output
hydra:
  run:
    dir: outputs/phase2_pair_affinity/${now:%Y-%m-%d}/${now:%H-%M-%S}
