# configs/affinity.yaml
defaults:
  - _self_
  - model: esm_lora  

# --- TRANSFER LEARNING ---
pretrained_ckpt_path: null

data:
  base_csv: "data/dummy/base_data.csv"
  lookup_csv: "data/dummy/lookup_data.csv"
  num_workers: 6

training:
  seed: 42
  batch_size: 16
  learning_rate: 1e-4  
  weight_decay: 1e-4
  max_epochs: 20
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  use_mixed_precision: false
  accumulate_grad_batches: 1

  wandb:
    project: "affinity-finetune"

# Standard Hydra Output
hydra:
  run:
    dir: outputs/phase2_affinity/${now:%Y-%m-%d}/${now:%H-%M-%S}