# configs/model/esm_binding.yaml
name: "facebook/esm2_t33_650M_UR50D"
arch: "binding"
max_length: 1024
binding_head: "affinity"  # "classify" for binary pretrain, "affinity" for regression/ranking

# Decoder Parameters
d_model: 256
n_heads: 8
n_cross_layers: 2
dropout: 0.1
sparse_topk: 0  # 0 = dense attention; >0 = sparse top-k cross-attention (per query position)

# LoRA
lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: ["query", "key", "value"]
  modules_to_save: []
  n_last_layers: 4
