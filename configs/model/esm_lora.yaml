# configs/model/esm_lora.yaml
name: "facebook/esm2_t6_8M_UR50D"
max_length: 1024

# Decoder Parameters (Simple/Standard)
hidden_size: 128 
nhead: 4          
num_layers: 2
dropout: 0.1
pooling: "attention"

# LoRA
lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: ["query", "key", "value"]
  modules_to_save: []