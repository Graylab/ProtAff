defaults:
  - _self_
  - model: esm_binding

# Task name (Informational for logging)
task_name: "pair_affinity"

# Resume training from a crash (Load optimizer state)
resume_checkpoint_path: null

data:
  # --- Paths ---
  base_csv: "data/combined/base_cleaned.csv"
  lookup_csv: "data/combined/lookup_data.csv"
  test_csv: "data/test/test_adaptyv.csv"
  binary_test_csv: "data/test/test_binary.csv"
  
  # --- Pair Mining ---
  pair_group_cols: null
  pairs_per_sample: 2 # default 2
  inter_pps: 10 # default 10
  min_margin: 1.0 # default 1.0
  max_margin: 5.0 # default null
  max_anchors_per_target: 2000 # default 2000

  # --- Sampling & Balancing ---
  weight_col: "cluster_id"
  balance_clusters: true
  balance_power: 0.25 # default 0.25

  # --- DataLoader ---
  num_workers: 6

training:
  seed: 42
  split_strategy: "group"
  train_val_split: 0.9

  # Batch and Steps
  # Note: Effective batch size = batch_size * 2 (since we process Better + Worse)
  batch_size: 16              # Lowered slightly as we process 2x sequences per step
  accumulate_grad_batches: 2 # Increased to maintain effective batch size
  max_epochs: 25             # Ranking often takes longer to converge than regression

  # Loss Function
  loss_type: "margin"  # Options: margin, soft_margin, bce, margin_weighted, contrastive
  margin: 0.1
  temperature: 0.1  # For contrastive loss

  # Optimizer
  learning_rate: 5e-5        # Slightly lower LR is often better for ranking fine-tuning
  weight_decay: 1e-2
  warmup_ratio: 0.1

  # Model saving 
  monitor_metric: "val_loss"              # Metric to monitor: "val_loss", "val_spearman", "test_spearman"
  monitor_mode: "min"                         # "min" for loss, "max" for spearman/accuracy

  # Early Stopping
  early_stopping: false
  early_stopping_patience: 5                  # Stop after N epochs without improvement

  # Testing
  test_every_val: true                        # Run test evaluation after each validation
  test_binary_every_val: true
  binary_test_every_n_epoch: 1

  # Hardware
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  precision: "bf16-mixed"

  # Stability
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  val_check_interval: 1.0
  
  wandb:
    project: "pair-affinity-finetune"

# Standard Hydra Output
hydra:
  run:
    dir: outputs/pair_affinity/${now:%Y-%m-%d}/${now:%H-%M-%S}
